<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pac-Man Custom</title>
    <style>
        /* Глобальный сброс и фон */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            touch-action: none; /* предотвращает прокрутку и жесты */
            user-select: none;
        }

        /* Контейнер для игры */
        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 650px; /* максимальная ширина для больших экранов */
            aspect-ratio: 630 / 750; /* соотношение ширины к высоте (с учётом панели) */
            background: #000;
            touch-action: none;
        }

        /* Канвас — занимает всю площадь контейнера */
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            touch-action: none;
            image-rendering: pixelated;
        }

        /* Сенсорные кнопки (поверх канваса) */
        #controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            height: 120px;
            pointer-events: none; /* контейнер не перехватывает */
            touch-action: none;
        }

        .ctrl-btn {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
            user-select: none;
            transition: background 0.1s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }

        #btn-up {
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
        }
        #btn-down {
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%);
        }
        #btn-left {
            bottom: 35px;
            left: 10px;
        }
        #btn-right {
            bottom: 35px;
            right: 10px;
        }

        /* Инструкция для мобильных */
        #hint {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 5;
            display: none; /* скрыта по умолчанию, покажем только на мобильных через медиа */
        }
        @media (pointer: coarse) {
            #hint { display: block; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    <div id="hint">👆 свайп по полю или кнопки</div>

    <!-- Крестовина -->
    <div id="controls">
        <div class="ctrl-btn" id="btn-up">▲</div>
        <div class="ctrl-btn" id="btn-down">▼</div>
        <div class="ctrl-btn" id="btn-left">◄</div>
        <div class="ctrl-btn" id="btn-right">►</div>
    </div>
</div>

<script>
// ============================================================
//  КОНСТАНТЫ
// ============================================================
const CELL_SIZE = 30;
const ROWS = 21;
const COLS = 21;
const WIDTH = COLS * CELL_SIZE;
const HEIGHT = ROWS * CELL_SIZE;
const PANEL_HEIGHT = 60;
const SCREEN_WIDTH = WIDTH;
const SCREEN_HEIGHT = HEIGHT + PANEL_HEIGHT;

const COLORS = {
    BLACK: '#000000',
    WHITE: '#ffffff',
    GREEN: '#00ff00',
    RED: '#ff0000',
    BLUE: '#0000ff',
    GRAY: '#666666',
};

const LIVES = 3;
const PLAYER_IMAGE_PATH = 'player.png';
const ENEMY_IMAGE_PATH = 'enemy.png';

// ============================================================
//  КЛАССЫ
// ============================================================
class Enemy {
    constructor(r, c) {
        this.r = r;
        this.c = c;
        this.dir = [0, 0];
        this.moveCounter = 0;
    }

    move(grid, playerPos) {
        this.moveCounter++;
        if (this.moveCounter % 2 !== 0) return;

        const dirs = [[-1,0], [1,0], [0,-1], [0,1]];
        for (let i = dirs.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
        }

        let chosenDir = null;
        if (Math.random() < 0.2) {
            let bestDist = Infinity;
            for (const [dr, dc] of dirs) {
                const nr = this.r + dr, nc = this.c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === 0) {
                    const dist = Math.abs(nr - playerPos[0]) + Math.abs(nc - playerPos[1]);
                    if (dist < bestDist) {
                        bestDist = dist;
                        chosenDir = [dr, dc];
                    }
                }
            }
        }

        if (!chosenDir) {
            for (const [dr, dc] of dirs) {
                const nr = this.r + dr, nc = this.c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === 0) {
                    chosenDir = [dr, dc];
                    break;
                }
            }
        }

        if (chosenDir) {
            this.dir = chosenDir;
            const newR = this.r + this.dir[0];
            const newC = this.c + this.dir[1];
            if (newR >= 0 && newR < ROWS && newC >= 0 && newC < COLS && grid[newR][newC] === 0) {
                this.r = newR;
                this.c = newC;
            }
        }
    }
}

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');

        // Размер канваса в пикселях (внутренний)
        this.canvas.width = SCREEN_WIDTH;
        this.canvas.height = SCREEN_HEIGHT;

        this.font = '24px Arial';
        this.playerImg = null;
        this.enemyImg = null;
        this.imagesLoaded = 0;
        this.totalImages = 2;

        this.loadImages();

        this.resetGame();

        // Цикл игры
        this.lastUpdate = 0;
        this.updateInterval = 140; // мс (~7 кадров/с)
        this.running = true;
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);

        // Управление с клавиатуры
        window.addEventListener('keydown', (e) => this.handleKey(e));
        // Блокируем скролл стрелками
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','s','S','a','A','d','D'].includes(e.key)) {
                e.preventDefault();
            }
        });

        // Сенсорное управление
        this.setupTouchControls();
    }

    loadImages() {
        const load = (src, callback) => {
            const img = new Image();
            img.onload = () => { callback(img); };
            img.onerror = () => { callback(null); };
            img.src = src;
        };
        load(PLAYER_IMAGE_PATH, (img) => {
            this.playerImg = img;
            this.imagesLoaded++;
        });
        load(ENEMY_IMAGE_PATH, (img) => {
            this.enemyImg = img;
            this.imagesLoaded++;
        });
    }

    resetGame() {
        this.lives = LIVES;
        this.score = 0;
        this.level = 0;
        this.playerDir = [0, 0];
        this.generateLevel();
    }

    generateLevel() {
        this.level++;
        this.grid = Array.from({ length: ROWS }, () => Array(COLS).fill(1));

        const carve = (r, c) => {
            this.grid[r][c] = 0;
            const dirs = [[0,2], [0,-2], [2,0], [-2,0]];
            for (let i = dirs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
            }
            for (const [dr, dc] of dirs) {
                const nr = r + dr, nc = c + dc;
                if (nr > 0 && nr < ROWS && nc > 0 && nc < COLS && this.grid[nr][nc] === 1) {
                    this.grid[r + dr/2][c + dc/2] = 0;
                    carve(nr, nc);
                }
            }
        };
        carve(1, 1);

        let extra = 0;
        const targetExtra = Math.floor(ROWS * COLS / 20);
        while (extra < targetExtra) {
            const r = Math.floor(Math.random() * (ROWS-2)) + 1;
            const c = Math.floor(Math.random() * (COLS-2)) + 1;
            if (this.grid[r][c] === 1) {
                this.grid[r][c] = 0;
                extra++;
            }
        }

        this.food = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (this.grid[r][c] === 0) this.food.push([r, c]);
            }
        }

        this.playerPos = [Math.floor(ROWS/2), Math.floor(COLS/2)];
        const playerIdx = this.food.findIndex(([r,c]) => r === this.playerPos[0] && c === this.playerPos[1]);
        if (playerIdx !== -1) this.food.splice(playerIdx, 1);

        this.enemies = [];
        const startPositions = [[1,1], [1, COLS-2], [ROWS-2, 1], [ROWS-2, COLS-2]];
        for (let i = startPositions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [startPositions[i], startPositions[j]] = [startPositions[j], startPositions[i]];
        }
        for (const [r, c] of startPositions) {
            if (this.grid[r][c] === 0 && !(r === this.playerPos[0] && c === this.playerPos[1])) {
                this.enemies.push(new Enemy(r, c));
            } else {
                for (let rr = 0; rr < ROWS; rr++) {
                    let found = false;
                    for (let cc = 0; cc < COLS; cc++) {
                        if (this.grid[rr][cc] === 0 && !(rr === this.playerPos[0] && cc === this.playerPos[1])) {
                            this.enemies.push(new Enemy(rr, cc));
                            found = true;
                            break;
                        }
                    }
                    if (found) break;
                }
            }
        }

        for (const enemy of this.enemies) {
            const idx = this.food.findIndex(([r,c]) => r === enemy.r && c === enemy.c);
            if (idx !== -1) this.food.splice(idx, 1);
        }

        this.totalFood = this.food.length;
    }

    // ============================================================
    //  УПРАВЛЕНИЕ
    // ============================================================
    setDirection(dr, dc) {
        this.playerDir = [dr, dc];
    }

    handleKey(e) {
        const key = e.key;
        if (key === 'ArrowUp' || key === 'w' || key === 'W') {
            this.setDirection(-1, 0);
            e.preventDefault();
        } else if (key === 'ArrowDown' || key === 's' || key === 'S') {
            this.setDirection(1, 0);
            e.preventDefault();
        } else if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
            this.setDirection(0, -1);
            e.preventDefault();
        } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
            this.setDirection(0, 1);
            e.preventDefault();
        }
    }

    setupTouchControls() {
        // Кнопки
        const btnUp = document.getElementById('btn-up');
        const btnDown = document.getElementById('btn-down');
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        const bindBtn = (btn, dr, dc) => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                this.setDirection(dr, dc);
            });
            // Также для мыши (для отладки на десктопе)
            btn.addEventListener('mousedown', (e) => {
                e.preventDefault();
                this.setDirection(dr, dc);
            });
        };
        bindBtn(btnUp, -1, 0);
        bindBtn(btnDown, 1, 0);
        bindBtn(btnLeft, 0, -1);
        bindBtn(btnRight, 0, 1);

        // Свайпы по канвасу
        let touchStartX = 0, touchStartY = 0;
        const canvas = this.canvas;
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            touchStartX = (touch.clientX - rect.left) * scaleX;
            touchStartY = (touch.clientY - rect.top) * scaleY;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 0) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (touch.clientX - rect.left) * scaleX;
            const y = (touch.clientY - rect.top) * scaleY;
            const dx = x - touchStartX;
            const dy = y - touchStartY;
            const threshold = 30;
            if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    this.setDirection(0, dx > 0 ? 1 : -1);
                } else {
                    this.setDirection(dy > 0 ? 1 : -1, 0);
                }
                // Сбрасываем начальную точку, чтобы не срабатывало постоянно
                touchStartX = x;
                touchStartY = y;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            // Можно оставить последнее направление, ничего не меняем
        });
    }

    // ============================================================
    //  ИГРОВАЯ ЛОГИКА
    // ============================================================
    update() {
        const [dr, dc] = this.playerDir;
        const newR = this.playerPos[0] + dr;
        const newC = this.playerPos[1] + dc;
        if (newR >= 0 && newR < ROWS && newC >= 0 && newC < COLS && this.grid[newR][newC] === 0) {
            this.playerPos = [newR, newC];
        }

        const idx = this.food.findIndex(([r,c]) => r === this.playerPos[0] && c === this.playerPos[1]);
        if (idx !== -1) {
            this.food.splice(idx, 1);
            this.score++;
        }

        for (const enemy of this.enemies) {
            enemy.move(this.grid, this.playerPos);
        }

        for (const enemy of this.enemies) {
            if (enemy.r === this.playerPos[0] && enemy.c === this.playerPos[1]) {
                this.lives--;
                if (this.lives <= 0) {
                    this.gameOver();
                } else {
                    this.resetPositions();
                }
                return;
            }
        }

        if (this.food.length === 0) {
            this.generateLevel();
        }
    }

    resetPositions() {
        this.playerPos = [Math.floor(ROWS/2), Math.floor(COLS/2)];
        const startPositions = [[1,1], [1, COLS-2], [ROWS-2, 1], [ROWS-2, COLS-2]];
        for (let i = startPositions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [startPositions[i], startPositions[j]] = [startPositions[j], startPositions[i]];
        }
        for (let i = 0; i < this.enemies.length && i < startPositions.length; i++) {
            const [r, c] = startPositions[i];
            if (this.grid[r][c] === 0) {
                this.enemies[i].r = r;
                this.enemies[i].c = c;
            }
        }
    }

    gameOver() {
        this.running = false;
        const ctx = this.ctx;
        ctx.fillStyle = COLORS.BLACK;
        ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = COLORS.RED;
        ctx.font = 'bold 40px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`GAME OVER!  Score: ${this.score}`, SCREEN_WIDTH/2, SCREEN_HEIGHT/2 - 20);
        ctx.fillStyle = COLORS.WHITE;
        ctx.font = '20px Arial';
        ctx.fillText('Обновите страницу, чтобы начать заново', SCREEN_WIDTH/2, SCREEN_HEIGHT/2 + 40);
    }

    // ============================================================
    //  ОТРИСОВКА
    // ============================================================
    draw() {
        const ctx = this.ctx;
        ctx.fillStyle = COLORS.BLACK;
        ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

        // Панель
        ctx.fillStyle = COLORS.BLACK;
        ctx.fillRect(0, 0, SCREEN_WIDTH, PANEL_HEIGHT);
        ctx.font = this.font;
        ctx.fillStyle = COLORS.WHITE;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(`Score: ${this.score}`, 10, 10);
        ctx.textAlign = 'right';
        ctx.fillText(`Lives: ${this.lives}`, SCREEN_WIDTH - 10, 10);
        ctx.textAlign = 'center';
        ctx.fillText(`Level: ${this.level}`, SCREEN_WIDTH/2, 10);

        // Лабиринт
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (this.grid[r][c] === 1) {
                    ctx.fillStyle = COLORS.WHITE;
                    ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE + PANEL_HEIGHT, CELL_SIZE, CELL_SIZE);
                }
            }
        }

        // Еда
        ctx.fillStyle = COLORS.GREEN;
        for (const [r, c] of this.food) {
            const cx = c * CELL_SIZE + CELL_SIZE/2;
            const cy = r * CELL_SIZE + PANEL_HEIGHT + CELL_SIZE/2;
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, 2 * Math.PI);
            ctx.fill();
        }

        // Игрок
        const px = this.playerPos[1] * CELL_SIZE;
        const py = this.playerPos[0] * CELL_SIZE + PANEL_HEIGHT;
        if (this.playerImg && this.playerImg.complete && this.playerImg.naturalWidth > 0) {
            ctx.drawImage(this.playerImg, px, py, CELL_SIZE, CELL_SIZE);
        } else {
            ctx.fillStyle = COLORS.BLUE;
            ctx.beginPath();
            ctx.arc(px + CELL_SIZE/2, py + CELL_SIZE/2, CELL_SIZE/2 - 2, 0, 2 * Math.PI);
            ctx.fill();
        }

        // Враги
        for (const enemy of this.enemies) {
            const ex = enemy.c * CELL_SIZE;
            const ey = enemy.r * CELL_SIZE + PANEL_HEIGHT;
            if (this.enemyImg && this.enemyImg.complete && this.enemyImg.naturalWidth > 0) {
                ctx.drawImage(this.enemyImg, ex, ey, CELL_SIZE, CELL_SIZE);
            } else {
                ctx.fillStyle = COLORS.RED;
                ctx.beginPath();
                ctx.arc(ex + CELL_SIZE/2, ey + CELL_SIZE/2, CELL_SIZE/2 - 2, 0, 2 * Math.PI);
                ctx.fill();
            }
        }
    }

    loop(timestamp) {
        if (!this.running) {
            this.draw();
            requestAnimationFrame(this.loop);
            return;
        }

        if (timestamp - this.lastUpdate >= this.updateInterval) {
            this.update();
            this.lastUpdate = timestamp;
        }
        this.draw();
        requestAnimationFrame(this.loop);
    }
}

// ============================================================
//  ЗАПУСК
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    new Game();
});
</script>
</body>
</html>
